name: Automated Infrastructure Scraper

on:
  schedule:
    # Runs every Monday at 02:00 WIB (Sunday 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Run Scraper Pipeline
        run: |
          python -m pipeline.run_pipeline

      - name: Commit and Push if Data Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(data): automated infrastructure data update [skip ci]"
            git push origin main
          fi
